---
# Keep the Jammy runtime workaround together so it can be retired with Jammy.
- name: Install the managed Python 3.11 runtime
  when:
    - openwisp2_python == 'python3.11'
    - not ansible_check_mode
  block:
    - name: Install APT HTTPS prerequisites
      ansible.builtin.apt:
        name: ca-certificates
        update_cache: true
        cache_valid_time: 3600

    - name: Install the scoped deadsnakes signing key
      ansible.builtin.get_url:
        url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776
        dest: /usr/share/keyrings/openwisp-deadsnakes.asc
        mode: "0644"

    - name: Configure the deadsnakes repository for Jammy
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/openwisp-deadsnakes.asc]
          https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu jammy main
        filename: openwisp-deadsnakes
        update_cache: true

    - name: Install Python 3.11 and its extension build dependencies
      ansible.builtin.apt:
        name:
          - python3.11
          - python3.11-dev
          - python3.11-venv
          - python3.11-distutils
          - python3.11-gdbm
        state: latest

- name: Explain managed runtime provisioning in check mode
  ansible.builtin.debug:
    msg: >-
      Check mode does not provision or predict the deadsnakes repository and
      packages. Installed interpreters are inspected read-only; a missing
      managed interpreter will be validated after a normal provisioning run.
  when:
    - ansible_check_mode
    - openwisp2_python == 'python3.11'

- name: Check the selected Jammy application interpreter
  ansible.builtin.command:
    argv:
      - "{{ openwisp2_python }}"
      - -c
      - >-
        import json, sys;
        print(json.dumps({'version': list(sys.version_info[:3]),
        'releaselevel': sys.version_info.releaselevel}))
  register: openwisp2_runtime
  failed_when:
    - openwisp2_runtime.rc != 0
    - not (ansible_check_mode and openwisp2_python == 'python3.11')
  changed_when: false
  check_mode: false

- name: Require a stable supported application interpreter
  when: openwisp2_runtime.rc == 0
  ansible.builtin.assert:
    that:
      - (openwisp2_runtime.stdout | from_json).version >= [3, 11, 0]
      - (openwisp2_runtime.stdout | from_json).releaselevel == 'final'
    fail_msg: >-
      OpenWISP requires a stable Python 3.11 or newer. The Ubuntu 22.04
      system Python and its Python 3.11 release candidate are not suitable.
      Use the default managed python3.11 or provide a supported interpreter.

- name: Check for an existing application virtualenv
  ansible.builtin.stat:
    path: "{{ virtualenv_path }}/bin/python"
  register: openwisp2_existing_python

- name: Check the existing virtualenv interpreter
  when:
    - openwisp2_existing_python.stat.exists
    - openwisp2_runtime.rc == 0
  block:
    - name: Read the virtualenv Python version
      ansible.builtin.command:
        argv:
          - "{{ virtualenv_path }}/bin/python"
          - -c
          - >-
            import json, sys;
            print(json.dumps({'version': list(sys.version_info[:2]),
            'releaselevel': sys.version_info.releaselevel}))
      register: openwisp2_venv_runtime
      changed_when: false
      check_mode: false

    - name: Reject an incompatible existing virtualenv without modifying it
      ansible.builtin.assert:
        that:
          - (openwisp2_venv_runtime.stdout | from_json).version == (openwisp2_runtime.stdout | from_json).version[:2]
          - (openwisp2_venv_runtime.stdout | from_json).releaselevel == 'final'
        fail_msg: >-
          Changing openwisp2_python does not upgrade an existing virtualenv.
          Set openwisp2_virtualenv_path to a new directory and rerun the full
          role. The existing directory is retained for recovery.
