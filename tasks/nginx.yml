---
- name: Set nginx max upload size
  # Required to allow uploading firmware images
  ansible.builtin.set_fact:
    openwisp2_nginx_client_max_body_size: "{{ openwisp2_firmware_upgrader_max_file_size }}"
  when: openwisp2_firmware_upgrader
  tags: [nginx_security]

- name: Validate nginx trusted proxies
  block:
    - name: Check nginx trusted proxy addresses
      ansible.builtin.command:
        argv:
          - "{{ openwisp2_python }}"
          - -c
          - import ipaddress, sys; ipaddress.ip_network(sys.argv[1], strict=False)
          - "{{ proxy }}"
      loop: "{{ openwisp2_nginx_trusted_proxies }}"
      loop_control:
        loop_var: proxy
      register: nginx_trusted_proxy_validation
      changed_when: false
      failed_when: false

    - name: Assert nginx trusted proxy addresses are valid
      ansible.builtin.assert:
        that:
          - >-
            nginx_trusted_proxy_validation.results | selectattr('rc', 'ne', 0)
            | list | length == 0
        fail_msg: >-
          openwisp2_nginx_trusted_proxies entries must be IP addresses or
          networks.

- name: Configure nginx static compression
  tags: [nginx_security]
  block:
    - name: Get nginx build configuration
      ansible.builtin.command: nginx -V
      register: nginx_build_config
      changed_when: false

    - name: Get nginx loaded configuration
      ansible.builtin.command: nginx -T
      register: nginx_loaded_config
      changed_when: false

    - name: Set nginx static compression facts
      ansible.builtin.set_fact:
        nginx_gzip_static_module_available: >-
          {{ 'http_gzip_static_module' in (nginx_build_config.stderr | default('')) }}
        nginx_brotli_static_module_available: >-
          {{ 'brotli_static_module' in (
            (nginx_build_config.stderr | default('')) ~
            (nginx_loaded_config.stdout | default('')) ~
            (nginx_loaded_config.stderr | default(''))
          ) }}

    - name: Validate nginx static compression settings
      ansible.builtin.assert:
        that:
          - >-
            (openwisp2_nginx_gzip_static | string | lower) != 'true' or
            nginx_gzip_static_module_available
          - >-
            (openwisp2_nginx_brotli_static | string | lower) != 'true' or
            nginx_brotli_static_module_available
        fail_msg: "A required nginx static compression module is not available."

    - name: Set enabled nginx static compression facts
      ansible.builtin.set_fact:
        nginx_gzip_static_available: >-
          {{ nginx_gzip_static_module_available and
             (openwisp2_nginx_gzip_static | string | lower) in ['true', 'auto'] }}
        nginx_brotli_static_available: >-
          {{ nginx_brotli_static_module_available and
             (openwisp2_nginx_brotli_static | string | lower) in ['true', 'auto'] }}

- name: Create public_html directory
  ansible.builtin.file:
    path: "{{ openwisp2_path }}/public_html"
    state: directory
    mode: "0775"

- name: Create nginx openwisp2 configuration directory
  ansible.builtin.file:
    path: "{{ openwisp2_path }}/nginx-conf/openwisp2"
    state: directory
    mode: "0770"

- name: Create SSL directory
  ansible.builtin.file:
    path: "{{ openwisp2_path }}/ssl"
    state: directory
    mode: "0770"

- name: Create SSL cert if not exists yet
  ansible.builtin.command:
    cmd: >
      openssl req -new -nodes -x509
      -subj "/C={{ openwisp2_ssl_country }}/ST={{ openwisp2_ssl_state }}
             /L={{ openwisp2_ssl_locality }}/O={{ openwisp2_ssl_organization }}
             /CN={{ openwisp2_ssl_common_name }}"
      -days 3650
      -keyout {{ openwisp2_ssl_key }}
      -out {{ openwisp2_ssl_cert }}
      -extensions v3_ca
    creates: "{{ openwisp2_ssl_cert }}"
  notify: Restart nginx

- name: Copy SSL cert to be added to trusted Cert (for freeradius)
  ansible.builtin.copy:
    src: "{{ openwisp2_ssl_cert }}"
    dest: /usr/local/share/ca-certificates/openwisp-ssl-server.crt
    remote_src: true
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Update-ca-certificates

- name: Disable default nginx configuration
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/default"
    state: absent

# Treat the SSL/security includes and the server site as one Nginx update.
# Otherwise, reverting only the site after nginx -t fails leaves broken includes.
- name: Inspect existing Nginx include files
  ansible.builtin.stat:
    path: "{{ openwisp2_path }}/nginx-conf/openwisp2/{{ item }}"
    follow: false
  loop:
    - ssl.conf
    - security.conf
  register: nginx_includes_before
  tags: [nginx_security]

- name: Reject unsupported Nginx include file types
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isreg | default(false))
    fail_msg: "Nginx include {{ item.item }} is not a regular file."
  loop: "{{ nginx_includes_before.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [nginx_security]

- name: Save existing Nginx include files
  ansible.builtin.slurp:
    src: "{{ openwisp2_path }}/nginx-conf/openwisp2/{{ item.item }}"
  loop: "{{ nginx_includes_before.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  register: nginx_includes_saved
  tags: [nginx_security]

# Preserve the previous site, its enabled symlink and both include files.
- name: Inspect previous Nginx site configuration
  ansible.builtin.stat:
    path: "/etc/nginx/sites-available/{{ inventory_hostname }}"
    follow: false
  register: nginx_site_before
  tags: [nginx_security]

- name: Save previous Nginx site configuration
  ansible.builtin.slurp:
    src: "/etc/nginx/sites-available/{{ inventory_hostname }}"
  register: nginx_site_saved
  when: nginx_site_before.stat.exists
  tags: [nginx_security]

- name: Inspect previously enabled Nginx site
  ansible.builtin.stat:
    path: "/etc/nginx/sites-enabled/{{ inventory_hostname }}"
    follow: false
  register: nginx_enabled_before
  tags: [nginx_security]

- name: Verify that Nginx site paths can be managed safely
  ansible.builtin.assert:
    that:
      - not nginx_site_before.stat.exists or (nginx_site_before.stat.isreg | default(false))
      - not nginx_enabled_before.stat.exists or (nginx_enabled_before.stat.islnk | default(false))
    fail_msg: Existing Nginx site paths have unsupported file types; no changes made.
  tags: [nginx_security]

- name: Deploy Nginx files with complete configuration validation
  tags: [nginx_security]
  block:
    - name: Nginx SSL configuration
      ansible.builtin.template:
        src: nginx/ssl-conf.j2
        dest: "{{ openwisp2_path }}/nginx-conf/openwisp2/ssl.conf"
        mode: "0644"
      register: nginx_ssl_render

    - name: Nginx security configuration
      ansible.builtin.template:
        src: nginx/security-conf.j2
        dest: "{{ openwisp2_path }}/nginx-conf/openwisp2/security.conf"
        mode: "0644"
      register: nginx_security_render

    - name: Nginx site available
      ansible.builtin.template:
        src: nginx/site-conf.j2
        dest: "/etc/nginx/sites-available/{{ inventory_hostname }}"
        mode: "0644"
      register: nginx_site_render

    - name: Nginx site enabled
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ inventory_hostname }}"
        dest: "/etc/nginx/sites-enabled/{{ inventory_hostname }}"
        state: link
      register: nginx_site_link

    - name: Validate complete Nginx configuration before scheduling restart
      ansible.builtin.command: nginx -t
      changed_when: >-
        nginx_site_render.changed or nginx_site_link.changed or
        nginx_ssl_render.changed or nginx_security_render.changed
      notify: Restart nginx
      when: not ansible_check_mode

  rescue:
    - name: Restore previously enabled Nginx site link
      ansible.builtin.file:
        src: "{{ nginx_enabled_before.stat.lnk_source }}"
        dest: "/etc/nginx/sites-enabled/{{ inventory_hostname }}"
        state: link
        force: true
      when: nginx_enabled_before.stat.islnk | default(false)

    - name: Remove newly enabled Nginx site link
      ansible.builtin.file:
        path: "/etc/nginx/sites-enabled/{{ inventory_hostname }}"
        state: absent
      when: not (nginx_enabled_before.stat.islnk | default(false))

    - name: Restore previous Nginx site contents
      ansible.builtin.copy:
        content: "{{ nginx_site_saved.content | b64decode }}"
        dest: "/etc/nginx/sites-available/{{ inventory_hostname }}"
        owner: "{{ nginx_site_before.stat.pw_name | default('root') }}"
        group: "{{ nginx_site_before.stat.gr_name | default('root') }}"
        mode: "{{ nginx_site_before.stat.mode | default('0644') }}"
      when: nginx_site_before.stat.exists

    - name: Remove new Nginx site if no previous site existed
      ansible.builtin.file:
        path: "/etc/nginx/sites-available/{{ inventory_hostname }}"
        state: absent
      when: not nginx_site_before.stat.exists

    - name: Restore existing Nginx include files after failed validation
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "{{ openwisp2_path }}/nginx-conf/openwisp2/{{ item.item.item }}"
        owner: "{{ item.item.stat.pw_name | default('root') }}"
        group: "{{ item.item.stat.gr_name | default('root') }}"
        mode: "{{ item.item.stat.mode | default('0644') }}"
      loop: "{{ nginx_includes_saved.results }}"
      loop_control:
        label: "{{ item.item.item }}"
      when: item.item.stat.exists

    - name: Remove new Nginx include files after failed validation
      ansible.builtin.file:
        path: "{{ openwisp2_path }}/nginx-conf/openwisp2/{{ item.item }}"
        state: absent
      loop: "{{ nginx_includes_before.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    - name: Check Nginx configuration following rollback
      ansible.builtin.command: nginx -t
      register: nginx_after_rollback
      failed_when: false
      changed_when: false

    - name: Stop deployment after rejected Nginx configuration
      ansible.builtin.fail:
        msg: >-
          Nginx site update rejected; previous site restored.
          Rollback syntax check rc={{ nginx_after_rollback.rc | default('unavailable') }}.
          Original error: {{ ansible_failed_result.msg | default('unknown') }}
          Nginx diagnostics: {{ ansible_failed_result.stderr | default('') }}

- name: Configure nginx log rotation
  ansible.builtin.template:
    src: logrotate.d/openwisp-nginx.j2
    dest: /etc/logrotate.d/openwisp-nginx
    mode: "0644"

- name: Disable nginx server tokens
  ansible.builtin.replace:
    path: /etc/nginx/nginx.conf
    regexp: "#(\\s+)server_tokens off"
    replace: "server_tokens off"
    backup: true
  notify: Restart nginx
