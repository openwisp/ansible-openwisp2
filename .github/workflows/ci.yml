---

name: Ansible-OpenWISP2 CI Build

on:             # yamllint disable-line rule:truthy
  push:
    branches:
      - master
      - dev
      - "[0-9]+.[0-9]+"
  pull_request:
    branches:
      - master
      - dev
      - "[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.distro }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
          - debian12
          - debian13

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install python dependencies
        id: deps
        run: |
          pip install -U pip wheel setuptools
          pip install -r requirements-test.txt

      - name: Install Ansible Galaxy dependencies
        id: galaxy
        run: ansible-galaxy collection install "community.general:>=3.6.0"

      - name: QA checks
        continue-on-error: true
        run: |
          ./run-qa-checks

      - name: Tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' && steps.galaxy.conclusion == 'success' }}
        run: |
          mkdir -p ~/.ansible/roles
          ln -s "$GITHUB_WORKSPACE" ~/.ansible/roles/openwisp.openwisp2
          molecule test
        env:
          ROLE_NAME: openwisp2
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          ANSIBLE_ROLES_PATH: /home/runner/.cache/molecule/ansible-openwisp2/default/roles:/home/runner/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

  import:
    name: Update imports on Ansible Galaxy
    runs-on: ubuntu-22.04
    environment: ansible-galaxy
    needs:
      - build

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install ansible
        run: pip install ansible

      - name: Update imports on Ansible Galaxy
        run: |
          ansible-galaxy role import --api-key "$GALAXY_API_KEY" openwisp ansible-openwisp2
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
