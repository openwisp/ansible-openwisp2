---

name: Ansible-OpenWISP2 CI Build

on:             # yamllint disable-line rule:truthy
  push:
    branches:
      - master
      - dev
      - "[0-9]+.[0-9]+"
  pull_request:
    branches:
      - master
      - dev
      - "[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    env:
      AI_REVIEW_CACHE_GLOB: molecule/resources/requirements.yml

    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
          - debian12
          - debian13
        include:
          - distro: ubuntu2404
            review_default: true # Used by on-demand AI reviews

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Identify runner image
        id: platform
        run: echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache pip downloads
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            ${{ format('{0}-{1}-{2}-pip-{3}-{4}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.python.outputs.python-version,
                hashFiles('requirements-test.txt', 'requirements.txt', 'setup.py',
                'install-ci-deps.sh', 'install-dev.sh')) }}

      - name: Cache Ansible collections
        uses: openwisp/openwisp-actions/.github/actions/ci-cache@7dd9179d47cc950e9e42e36dd881248554684218 # merged PR 41
        with:
          mode: write
          dependency-glob: ${{ env.AI_REVIEW_CACHE_GLOB }}
          image-os: ${{ steps.platform.outputs.image_os }}
          python-version: ${{ steps.python.outputs.python-version }}

      - name: Install python dependencies
        id: deps
        run: ./install-ci-deps.sh

      - name: QA checks
        continue-on-error: true
        run: |
          ./run-qa-checks

      - name: Tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: ./runtests
        env:
          ROLE_NAME: openwisp2
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          ANSIBLE_ROLES_PATH: /home/runner/.cache/molecule/ansible-openwisp2/default/roles:/home/runner/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

      - name: CI entry point tests
        run: python -m unittest discover -s tests -p 'test_ci_*.py'

  import:
    name: Update imports on Ansible Galaxy
    runs-on: ubuntu-22.04
    environment: ansible-galaxy
    needs:
      - test

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install ansible
        run: pip install ansible

      - name: Update imports on Ansible Galaxy
        run: |
          ansible-galaxy role import --api-key "$GALAXY_API_KEY" openwisp ansible-openwisp2
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
