---

- name: Converge
  hosts: all
  become: true

  vars:
    openwisp2_network_topology: true
    openwisp2_firmware_upgrader: true
    openwisp2_radius: true
    openwisp2_controller_subnet_division: true
    openwisp2_controller_whois_geoip_account: "123456"
    openwisp2_controller_whois_geoip_key: "test-geoip-key"
    openwisp2_controller_estimated_location_enabled: true
    openwisp2_uwsgi_extra_conf: |
      single-interpreter=True
    openwisp2_usage_metric_collection: false
    # Test nginx static compression modules
    openwisp2_nginx_gzip_static: auto
    openwisp2_nginx_brotli_static: auto
    openwisp2_extra_django_settings:
      ACCOUNT_RATE_LIMITS: false
    freeradius_eap_orgs:
      - name: openwisp
        uuid: 00000000-0000-0000-0000-000000000000
        radius_token: secret-radius-token
        auth_port: 1822
        acct_port: 1823
        inner_tunnel_auth_port: 18230

  pre_tasks:
    - name: Configure deadsnakes signing key test fixture
      when:
        - ansible_distribution == 'Ubuntu'
        - ansible_distribution_version == '22.04'
      block:
        - name: Download deadsnakes signing key with restricted permissions
          ansible.builtin.get_url:
            url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776
            dest: /usr/share/keyrings/openwisp-deadsnakes.asc
            mode: "0600"
          tags:
            - molecule-idempotence-notest

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_os_family == 'Debian'

    - name: Install net-tools
      apt:
        name:
          - net-tools

    - name: Remove the .dockerenv file
      file:
        path: /.dockerenv
        state: absent

  roles:
    - role: openwisp.openwisp2
