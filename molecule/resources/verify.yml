---

- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read OpenWISP settings
      ansible.builtin.slurp:
        src: /opt/openwisp2/openwisp2/settings.py
      register: openwisp_settings

    - name: Assert Controller GeoIP and estimated location settings
      ansible.builtin.assert:
        that:
          - "'OPENWISP_CONTROLLER_WHOIS_GEOIP_ACCOUNT = \"123456\"' in (openwisp_settings.content | b64decode)"
          - "'OPENWISP_CONTROLLER_WHOIS_GEOIP_KEY = \"test-geoip-key\"' in (openwisp_settings.content | b64decode)"
          - "'OPENWISP_CONTROLLER_WHOIS_ENABLED = True' in (openwisp_settings.content | b64decode)"
          - "'OPENWISP_CONTROLLER_ESTIMATED_LOCATION_ENABLED = True' in (openwisp_settings.content | b64decode)"
          - "'openwisp_controller.config.whois.tasks.cleanup_unreferenced_whois_records' in (openwisp_settings.content | b64decode)"
          - "'crontab(hour=2, minute=0)' in (openwisp_settings.content | b64decode)"

    - name: Verify timeseries database settings rendering
      block:
        - name: Load role defaults for timeseries database rendering
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../defaults/main.yml"

        - name: Set common settings template facts
          ansible.builtin.set_fact:
            openwisp2_secret_key: test-secret-key
            openwisp2_influxdb_backends:
              - openwisp_monitoring.db.backends.influxdb
              - openwisp_monitoring.db.backends.influxdb2

        - name: Render OpenWISP settings with InfluxDB 2.x timeseries database
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../templates/openwisp2/settings.py"
            dest: /tmp/openwisp2-settings-influxdb2.py
            mode: "0644"
          vars:
            openwisp2_timeseries_database:
              backend: openwisp_monitoring.db.backends.influxdb2
              name: openwisp2
              user: openwisp
              password: openwisp-token
              url: http://localhost:8086
              options:
                udp_writes: true
                udp_host: localhost
                udp_port: 8089

        - name: Read rendered InfluxDB 2.x settings
          ansible.builtin.slurp:
            src: /tmp/openwisp2-settings-influxdb2.py
          register: influxdb2_settings

        - name: Assert InfluxDB 2.x timeseries database settings
          ansible.builtin.assert:
            that:
              - "'\"BACKEND\": \"openwisp_monitoring.db.backends.influxdb2\"' in (influxdb2_settings.content | b64decode)"
              - "'\"URL\": \"http://localhost:8086\"' in (influxdb2_settings.content | b64decode)"
              - "'\"USER\": \"openwisp\"' in (influxdb2_settings.content | b64decode)"
              - "'\"PASSWORD\": \"openwisp-token\"' in (influxdb2_settings.content | b64decode)"
              - "'\"OPTIONS\": {' in (influxdb2_settings.content | b64decode)"
              - "'udp_writes' in (influxdb2_settings.content | b64decode)"
              - "'udp_host' in (influxdb2_settings.content | b64decode)"
              - "'udp_port' in (influxdb2_settings.content | b64decode)"
            fail_msg: "InfluxDB 2.x timeseries database settings were not rendered correctly."

        - name: Render OpenWISP settings with Elasticsearch timeseries database
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../templates/openwisp2/settings.py"
            dest: /tmp/openwisp2-settings-elasticsearch.py
            mode: "0644"
          vars:
            openwisp2_timeseries_database:
              backend: openwisp_monitoring.db.backends.elasticsearch
              name: openwisp2
              url: https://localhost:9200
              cloud_id: openwisp-cloud-id
              api_key: openwisp-api-key
              bearer_auth: openwisp-bearer-token
              user: elastic
              password: elastic-password
              ca_certs: /etc/elasticsearch/certs/http_ca.crt
              ssl_assert_fingerprint: test-fingerprint
              verify_certs: true
              options:
                refresh: wait_for
                read_size: 10000
                terms_size: 1000
                http_compress: true
                max_retries: 3
                request_timeout: 30
                retry_on_timeout: true

        - name: Read rendered Elasticsearch settings
          ansible.builtin.slurp:
            src: /tmp/openwisp2-settings-elasticsearch.py
          register: elasticsearch_settings

        - name: Assert Elasticsearch timeseries database settings
          ansible.builtin.assert:
            that:
              - "'\"BACKEND\": \"openwisp_monitoring.db.backends.elasticsearch\"' in (elasticsearch_settings.content | b64decode)"
              - "'\"URL\": \"https://localhost:9200\"' in (elasticsearch_settings.content | b64decode)"
              - "'\"CLOUD_ID\": \"openwisp-cloud-id\"' in (elasticsearch_settings.content | b64decode)"
              - "'\"API_KEY\": \"openwisp-api-key\"' in (elasticsearch_settings.content | b64decode)"
              - "'\"BEARER_AUTH\": \"openwisp-bearer-token\"' in (elasticsearch_settings.content | b64decode)"
              - "'\"CA_CERTS\": \"/etc/elasticsearch/certs/http_ca.crt\"' in (elasticsearch_settings.content | b64decode)"
              - "'\"SSL_ASSERT_FINGERPRINT\": \"test-fingerprint\"' in (elasticsearch_settings.content | b64decode)"
              - "'\"VERIFY_CERTS\": True' in (elasticsearch_settings.content | b64decode)"
              - "'\"OPTIONS\": {' in (elasticsearch_settings.content | b64decode)"
              - "'refresh' in (elasticsearch_settings.content | b64decode)"
              - "'read_size' in (elasticsearch_settings.content | b64decode)"
              - "'terms_size' in (elasticsearch_settings.content | b64decode)"
              - "'http_compress' in (elasticsearch_settings.content | b64decode)"
              - "'max_retries' in (elasticsearch_settings.content | b64decode)"
              - "'request_timeout' in (elasticsearch_settings.content | b64decode)"
              - "'retry_on_timeout' in (elasticsearch_settings.content | b64decode)"
            fail_msg: "Elasticsearch timeseries database settings were not rendered correctly."

        - name: Assert InfluxDB role dependency backend selection
          ansible.builtin.assert:
            that:
              - >
                'openwisp_monitoring.db.backends.influxdb'
                in openwisp2_influxdb_backends
              - >
                'openwisp_monitoring.db.backends.influxdb2'
                in openwisp2_influxdb_backends
              - >
                'openwisp_monitoring.db.backends.elasticsearch'
                not in openwisp2_influxdb_backends
            fail_msg: "InfluxDB role dependency backend selection is not correct."

    - name: Run a specific subset of tests
      command: >
        /opt/openwisp2/env/bin/python /opt/openwisp2/manage.py test --keepdb --exclude skip_prod \
            openwisp_controller.pki.tests.test_admin \
            openwisp_controller.pki.tests.test_models \
            openwisp_controller.config.tests.test_tag \
            openwisp_controller.config.tests.test_vpn \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_preview_device \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_device_preview_button \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_template_preview_button \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_vpn_preview_button \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_device_queryset \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_device_organization_fk_autocomplete_view \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_template_queryset \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_template_organization_fk_autocomplete_view \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_template_vpn_fk_autocomplete_view \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_vpn_queryset \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_vpn_organization_fk_autocomplete_view \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_vpn_ca_fk_queryset \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_vpn_cert_fk_queryset \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_changelist_recover_deleted_button \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_recoverlist_operator_403 \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_device_template_filter \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_device_contains_default_templates_js \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_template_not_contains_default_templates_js \
            openwisp_controller.config.tests.test_admin.TestAdmin.test_vpn_not_contains_default_templates_js \
            openwisp_controller.config.tests.test_notifications \
            openwisp_controller.subnet_division.tests.test_models \
            openwisp_notifications.tests.test_admin.TestAdmin
      changed_when: false

    - name: Check if redis-server is running
      command: systemctl status redis-server
      changed_when: false

    - name: Chcke if redis is running
      command: systemctl status redis
      changed_when: false

    - name: Check Openwisp
      block:
        - name: Check if OpenWISP is running
          uri:
            url: "https://{{ inventory_hostname }}/admin/login/?next=/admin/"
            validate_certs: false
      rescue:
        - name: Get OpenWisp log
          command: "tail -n 500 {{ openwisp2_path }}/log/*.log"
          register: openwisp_log

        - name: Show OpenWisp log
          debug:
            var: openwisp_log

    - name: Check if FreeRADIUS is listening on WPA Enterprise site ports
      shell: "netstat -tuln | grep -Eq '1822|1823|18230'"
      register: freeradius_eap_ports  # Register the output and return code
      failed_when: freeradius_eap_ports.rc | int != 0
      changed_when: false

    - name: Test nginx compression configuration
      block:
        - name: Get nginx build configuration
          ansible.builtin.command: nginx -V
          register: nginx_build_config
          changed_when: false

        - name: Get nginx loaded configuration
          ansible.builtin.command: nginx -T
          register: nginx_loaded_config
          changed_when: false

        - name: Set nginx static compression module availability facts
          ansible.builtin.set_fact:
            nginx_gzip_static_module_available: >-
              {{ 'http_gzip_static_module' in (nginx_build_config.stderr | default('')) }}
            nginx_brotli_static_module_available: >-
              {{ 'brotli_static_module' in (
                   (nginx_build_config.stderr | default('')) ~
                   (nginx_loaded_config.stdout | default('')) ~
                   (nginx_loaded_config.stderr | default(''))
                 ) }}

        - name: Read nginx site configuration
          ansible.builtin.slurp:
            src: "/etc/nginx/sites-enabled/{{ inventory_hostname }}"
          register: nginx_site_config

        - name: Assert nginx static compression directives match module availability
          ansible.builtin.assert:
            that:
              - >-
                ('gzip_static on;' in (nginx_site_config.content | b64decode)) ==
                nginx_gzip_static_module_available
              - >-
                ('brotli_static on;' in (nginx_site_config.content | b64decode)) ==
                nginx_brotli_static_module_available
            fail_msg: "Nginx static compression directives do not match available modules."

        - name: Test nginx configuration syntax
          ansible.builtin.command: nginx -t
          changed_when: false

        - name: Load role defaults for nginx static compression disabled test
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../defaults/main.yml"

        - name: Set nginx static compression facts with variables disabled
          ansible.builtin.set_fact:
            nginx_gzip_static_available: false
            nginx_brotli_static_available: false

        - name: Render nginx site configuration with static compression disabled
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../templates/nginx/site-conf.j2"
            dest: /tmp/openwisp2-nginx-static-compression-disabled.conf
            mode: "0644"

        - name: Read nginx site configuration with static compression disabled
          ansible.builtin.slurp:
            src: /tmp/openwisp2-nginx-static-compression-disabled.conf
          register: nginx_disabled_site_config

        - name: Assert nginx static compression directives are disabled
          ansible.builtin.assert:
            that:
              - "'gzip_static on;' not in (nginx_disabled_site_config.content | b64decode)"
              - "'brotli_static on;' not in (nginx_disabled_site_config.content | b64decode)"
            fail_msg: "Nginx static compression directives should be disabled."
