---

dependency:
  name: galaxy
  options:
    role-file: molecule/resources/requirements.yml
driver:
  name: docker
lint: |
  set -e
  ../../run-qa-checks
platforms:
  - name: "${ROLE_NAME:-instance}-${MOLECULE_DISTRO}"
    image: "geerlingguy/docker-${MOLECULE_DISTRO}-ansible:${tag:-latest}"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  # The Docker API connection avoids spawning the Docker CLI for every task
  # and supports pipelining, which reduces the runtime of the test suite.
  connection_options:
    ansible_connection: community.docker.docker_api
  env:
    MOLECULE_NO_LOG: false
  playbooks:
    converge: ../resources/${MOLECULE_PLAYBOOK:-converge.yml}
    verify: ../resources/verify.yml
  config_options:
    defaults:
      pipelining: true
      stdout_callback: default
      bin_ansible_callbacks: true
      callback_result_format: yaml
  inventory:
    host_vars:
      openwisp2-debian11:
        openwisp2_django_version: "django~=4.2.0"

verifier:
  name: ansible
