---
- name: Verify system Python and legacy environment preservation
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify Python 3.10 is unchanged
      ansible.builtin.command:
        argv:
          - "{{ item }}"
          - -c
          - "import sys; assert sys.version_info[:2] == (3, 10), sys.version"
      changed_when: false
      loop:
        - /usr/bin/python3
        - /opt/openwisp2-upgrade-test/env/bin/python

    - name: Read the legacy environment marker
      ansible.builtin.slurp:
        src: /opt/openwisp2-upgrade-test/env/legacy-marker
      register: legacy_marker

    - name: Assert the legacy environment was not replaced
      ansible.builtin.assert:
        that:
          - (legacy_marker.content | b64decode) == 'Preserve the previous environment for recovery.'
        fail_msg: The previous virtualenv must remain available for recovery.

    - name: Verify all application environments use stable Python 3.11
      ansible.builtin.command:
        argv:
          - "{{ item }}/bin/python"
          - -c
          - >-
            import dbm.gnu, netdiff, sqlite3, ssl, sys;
            assert sys.version_info[:2] == (3, 11), sys.version;
            assert sys.version_info.releaselevel == 'final', sys.version
      changed_when: false
      loop:
        - /opt/openwisp2-fresh-test/env-python3.11
        - /opt/openwisp2-upgrade-test/env-python3.11
        - /opt/openwisp2-custom-test/env
