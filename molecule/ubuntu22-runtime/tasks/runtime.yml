---
- name: Check the Jammy runtime before provisioning
  ansible.builtin.include_tasks:
    file: ../../../tasks/ubuntu-22.yml
    apply:
      check_mode: true

- name: Provision the Jammy runtime
  ansible.builtin.include_tasks: ../../../tasks/ubuntu-22.yml

- name: Install the dependency which requires Python 3.11
  ansible.builtin.pip:
    name: netdiff @ https://github.com/openwisp/netdiff/archive/refs/heads/1.4.tar.gz
    virtualenv: "{{ virtualenv_path }}"
    virtualenv_python: "{{ openwisp2_python }}"

- name: Check the selected runtime and required standard library extensions
  ansible.builtin.command:
    argv:
      - "{{ virtualenv_path }}/bin/python"
      - -c
      - >-
        import dbm.gnu, json, netdiff, sqlite3, ssl, sys;
        assert sys.version_info[:2] == (3, 11), sys.version;
        assert sys.version_info.releaselevel == 'final', sys.version
  changed_when: false

- name: Check the installed Jammy runtime and virtualenv
  ansible.builtin.include_tasks:
    file: ../../../tasks/ubuntu-22.yml
    apply:
      check_mode: true
